name: Build, Test & Publish to Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Repositories on Docker Hub follow the format: <username>/<repository_name>
  CLIENT_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/written-client
  SERVER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/written-server

jobs:
  # ===========================================================================
  # Job 1: Quality Checks & Unit Tests (Fail Fast Before Docker Build)
  # ===========================================================================
  verify-client:
    name: Lint & Typecheck (Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Typecheck
        working-directory: ./client
        run: npm run typecheck

  verify-server:
    name: Lint & Unit Check (Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install Server Dependencies
        working-directory: ./server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Code Syntax
        working-directory: ./server
        run: |
          python -m compileall app

  # ===========================================================================
  # Job 2: Build & Publish Images to Docker Hub (Gated by verification jobs)
  # ===========================================================================
  build-and-publish:
    name: Build & Push Images to Docker Hub
    needs: [verify-client, verify-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Authenticate to Docker Hub using GitHub Repository Secrets
      # -----------------------------------------------------------------------
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata (tags, labels) for Client
      - name: Extract Client Metadata
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build and push Client Image to Docker Hub
      - name: Build & Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile.optimize
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract metadata (tags, labels) for Server
      - name: Extract Server Metadata
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build and push Server Image to Docker Hub
      - name: Build & Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile.optimize
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
